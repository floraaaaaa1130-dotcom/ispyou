<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>[ i_SPY_u.net ]</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Noto+Sans+KR:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-pink: #FF007F;
            --neon-green: #00FF00;
            --bg-black: #000000;
            --panel-bg: #0a0508;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-black);
            color: var(--neon-pink);
            font-family: 'Noto Sans KR', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .font-pixel { font-family: 'Press Start 2P', cursive; }
        .font-vt { font-family: 'VT323', monospace; }

        /* CRT Overlay */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.3));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 9999;
        }

        /* Screen Flicker */
        .flicker { animation: crt-flicker 0.15s infinite; }
        @keyframes crt-flicker {
            0% { opacity: 0.97; }
            50% { opacity: 1; }
            100% { opacity: 0.98; }
        }

        /* Glitched Feed Image */
        .glitch-img-container { position: relative; overflow: hidden; cursor: pointer; border: 1px solid var(--border-color); }
        .glitch-img {
            width: 100%; height: 100%; object-fit: cover;
            filter: contrast(200%) grayscale(100%) blur(5px);
            transition: all 0.5s ease;
        }
        .glitch-img-container.revealed .glitch-img {
            filter: none;
        }
        .glitch-img-container .glitch-overlay {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,0,127,0.3) 10px, rgba(255,0,127,0.3) 20px);
            color: var(--neon-green); font-family: 'Press Start 2P', cursive; font-size: 10px;
            text-shadow: 1px 1px 0 #000;
            transition: opacity 0.5s;
        }
        .glitch-img-container.revealed .glitch-overlay { opacity: 0; pointer-events: none; }
        
        .glitch-img-container .caption {
            position: absolute; bottom: 0; left: 0; width: 100%; padding: 8px;
            background: rgba(0,0,0,0.8); color: white; font-family: 'VT323', monospace; font-size: 1.2rem;
            transform: translateY(100%); transition: transform 0.5s ease;
        }
        .glitch-img-container.revealed .caption { transform: translateY(0); }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #111; }
        ::-webkit-scrollbar-thumb { background: var(--neon-pink); border-radius: 3px; }

        .typewriter::after { content: '|'; animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* App Screens */
        .app-screen { display: none; width: 100vw; height: 100vh; overflow: hidden; }
        .app-screen.active { display: flex; }

        /* Spycam Filter */
        #spycam-video {
            filter: grayscale(100%) sepia(100%) hue-rotate(290deg) saturate(300%) contrast(150%);
            object-fit: cover;
        }
    </style>
</head>
<body class="flicker">

    <div class="scanlines"></div>

    <div id="screen-intro" class="app-screen active bg-black items-center justify-center p-4">
        <div class="w-full max-w-2xl text-left font-vt text-2xl lg:text-4xl text-[var(--neon-green)] drop-shadow-[0_0_5px_rgba(0,255,0,0.8)]">
            <p id="term-text" class="mb-6"></p>
            <div id="term-choices" class="hidden flex gap-8 mt-4">
                <button id="btn-y" class="hover:text-white hover:bg-[var(--neon-green)] hover:text-black px-2 transition-all">> [Y]es</button>
                <button id="btn-n" class="hover:text-[var(--neon-pink)] px-2 transition-all">> [N]o</button>
            </div>
        </div>
    </div>

    <div id="screen-id-gen" class="app-screen bg-black items-center justify-center p-4">
        <div class="border border-[var(--neon-pink)] p-8 max-w-sm w-full bg-[#0a0005] shadow-[0_0_20px_rgba(255,0,127,0.3)] text-center relative">
            <h2 class="font-pixel text-[10px] text-[var(--neon-green)] mb-6">> ID_GENERATOR.exe</h2>
            <p class="text-xs text-gray-400 mb-4 font-vt text-lg">새로운 그림자 신분이 부여되었습니다.</p>
            <div class="bg-black border border-dashed border-[var(--neon-pink)] p-4 mb-4">
                <span id="generated-id" class="font-pixel text-sm text-[var(--neon-pink)] animate-pulse">LOADING...</span>
            </div>
            <p class="text-[10px] text-gray-600 font-pixel">자동으로 연결됩니다...</p>
        </div>
    </div>

    <div id="screen-intro-chat" class="app-screen bg-black items-center justify-center p-4">
        <div class="w-full max-w-md bg-[var(--panel-bg)] border border-[var(--border-color)] h-[60vh] flex flex-col">
            <div class="border-b border-[var(--border-color)] p-3 flex items-center bg-black">
                <div class="w-2 h-2 bg-red-500 rounded-full animate-pulse mr-2"></div>
                <span class="font-pixel text-[10px] text-gray-400">ENCRYPTED_CONNECTION</span>
            </div>
            <div id="intro-chat-box" class="flex-grow p-4 flex flex-col gap-4 overflow-y-auto">
                <!-- Chat injected via JS -->
            </div>
            <div id="intro-chat-choices" class="p-4 border-t border-[var(--border-color)] bg-black hidden">
                <button id="btn-intro-reply" class="w-full text-left font-vt text-xl text-[var(--neon-green)] hover:bg-[#111] p-2 border border-transparent hover:border-[var(--neon-green)] transition-all">
                    > "지나가던 사람"
                </button>
            </div>
        </div>
    </div>

    <div id="screen-main" class="app-screen bg-[var(--bg-black)] flex-col lg:flex-row text-white">
        
        <!-- Mobile Header -->
        <div class="lg:hidden p-3 border-b border-[var(--neon-pink)] flex justify-between items-center bg-black shrink-0">
            <span class="font-pixel text-[12px] text-[var(--neon-pink)]">i_SPY_u</span>
            <span id="mobile-user-id" class="font-vt text-lg text-[var(--neon-green)]"></span>
        </div>

        <!-- Left Column: Member List -->
        <div class="w-full lg:w-64 border-b lg:border-b-0 lg:border-r border-[var(--border-color)] bg-black flex lg:flex-col overflow-x-auto lg:overflow-y-auto shrink-0 z-10">
            <div class="p-4 border-b border-[var(--border-color)] hidden lg:block">
                <h2 class="font-pixel text-[10px] text-[var(--neon-pink)]">> TARGET_LIST</h2>
            </div>
            <div id="member-list" class="flex lg:flex-col p-2 lg:p-0 gap-2 lg:gap-0">
                <!-- Members injected here -->
            </div>
        </div>

        <!-- Center Column: Feed -->
        <div class="flex-grow flex flex-col relative h-[40vh] lg:h-full overflow-hidden bg-[var(--panel-bg)]">
            <!-- Header (Profile + React + DM) -->
            <div class="p-4 border-b border-[var(--border-color)] bg-black flex justify-between items-center z-20 shrink-0">
                <div class="flex items-center gap-3">
                    <h1 id="feed-target-id" class="font-pixel text-sm text-white drop-shadow-[2px_2px_0_#FF007F]">TARGET</h1>
                    <span id="feed-target-status" class="hidden md:inline font-vt text-lg text-gray-400">[현재 상태: 뇌내 회로 꼬임]</span>
                    <button id="btn-react" class="text-xl hover:scale-125 transition-transform" title="반응 보내기">🩹</button>
                </div>
                <button id="btn-open-dm" class="border border-[var(--neon-green)] text-[var(--neon-green)] px-3 py-1 font-pixel text-[8px] hover:bg-[var(--neon-green)] hover:text-black transition-colors">
                    SEND_DM
                </button>
            </div>
            
            <!-- Feed Grid -->
            <div class="flex-grow overflow-y-auto p-4">
                <div id="feed-grid" class="grid grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Feed items injected here -->
                </div>
            </div>
        </div>

        <!-- Right Column: Profile, Activity, Guestbook -->
        <div class="w-full lg:w-80 border-t lg:border-t-0 lg:border-l border-[var(--border-color)] bg-black flex flex-col shrink-0 h-[50vh] lg:h-full overflow-y-auto">
            
            <!-- Emo Card (Profile) -->
            <div class="p-4 border-b border-[var(--border-color)] bg-[#050002]">
                <h2 class="font-pixel text-[10px] text-[var(--neon-green)] mb-3">> MY_EMO_CARD</h2>
                <div class="border border-dashed border-[var(--neon-pink)] p-3">
                    <div class="text-[10px] text-gray-500 font-pixel mb-1">ID:</div>
                    <div id="card-id" class="font-vt text-2xl text-white mb-3"></div>
                    <div class="text-[10px] text-gray-500 font-pixel mb-1">DATA:</div>
                    <div id="card-stickers" class="flex gap-2 text-xl min-h-[28px]">
                        <span class="text-gray-700 text-xs font-vt">파편을 모으세요.</span>
                    </div>
                </div>
            </div>

            <!-- Activity Log -->
            <div class="p-4 border-b border-[var(--border-color)] h-32 lg:h-48 flex flex-col">
                <h2 class="font-pixel text-[10px] text-[var(--neon-green)] mb-2">> LIVE_LOG</h2>
                <div id="activity-log" class="flex-grow overflow-y-auto space-y-1">
                    <div class="text-xs font-vt text-gray-500">[SYSTEM] 로그 모니터링 시작...</div>
                </div>
            </div>

            <!-- Guestbook -->
            <div class="p-4 flex-grow flex flex-col bg-[#050505]">
                <h2 class="font-pixel text-[10px] text-[var(--neon-pink)] mb-3">> GUESTBOOK</h2>
                <div id="guestbook-list" class="flex-grow overflow-y-auto space-y-2 mb-3 min-h-[100px]">
                    <!-- Messages -->
                </div>
                <div class="flex gap-2 shrink-0">
                    <input type="text" id="gb-input" class="flex-grow bg-transparent border-b border-[var(--border-color)] text-white font-vt text-xl focus:outline-none focus:border-[var(--neon-pink)]" placeholder="익명 메시지...">
                    <button id="gb-submit" class="text-[var(--neon-green)] font-pixel text-[10px] hover:text-white">SEND</button>
                </div>
            </div>
        </div>
    </div>

    <!-- DM Modal -->
    <div id="dm-modal" class="fixed inset-0 bg-black/90 hidden items-center justify-center z-50 p-4 backdrop-blur-sm">
        <div class="w-full max-w-md bg-black border border-[var(--neon-pink)] flex flex-col h-[60vh]">
            <div class="p-3 border-b border-[var(--neon-pink)] flex justify-between items-center">
                <div class="font-pixel text-[10px] text-[var(--neon-pink)]">DM :: <span id="dm-target-name"></span></div>
                <button id="btn-close-dm" class="text-white hover:text-[var(--neon-pink)] font-vt text-xl">X</button>
            </div>
            <div id="dm-messages" class="flex-grow p-4 overflow-y-auto space-y-4"></div>
            <div id="dm-choices" class="p-4 border-t border-[var(--border-color)] bg-[#0a0005]"></div>
        </div>
    </div>

    <!-- Spycam (PIP) -->
    <div id="spycam-container" class="fixed bottom-4 left-4 w-24 h-32 lg:w-32 lg:h-40 border-2 border-[var(--neon-pink)] bg-black z-40 shadow-[0_0_15px_rgba(255,0,127,0.5)] overflow-hidden">
        <div class="absolute top-1 left-1 text-[8px] font-pixel text-[var(--neon-green)] z-10 bg-black/50 px-1">REC •</div>
        <video id="spycam-video" autoplay playsinline muted class="w-full h-full"></video>
    </div>

    <script>
        // --- App State ---
        const memberList = ['sion__5', 'ri_ku_03', 'yushihihi_405', 'jaegee__zzang', 'ryo_hi_rose', 'sakusakusaku07'];
        let state = {
            userId: "",
            currentMember: memberList[0],
            stickers: new Set()
        };

        // --- Screen Management ---
        function showScreen(id) {
            document.querySelectorAll('.app-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // --- 1. Intro Screen ---
        const termText = document.getElementById('term-text');
        const msg = "[SYSTEM: 낯선 감정을 감지했습니다. 훔쳐보시겠습니까? Y/N]";
        let typeIdx = 0;

        function typeWriter() {
            if (typeIdx < msg.length) {
                termText.innerHTML += msg.charAt(typeIdx);
                typeIdx++;
                setTimeout(typeWriter, 50);
            } else {
                termText.classList.add('typewriter');
                setTimeout(() => {
                    document.getElementById('term-choices').classList.remove('hidden');
                }, 500);
            }
        }

        document.getElementById('btn-y').onclick = () => {
            showScreen('screen-id-gen');
            generateID();
        };

        document.getElementById('btn-n').onclick = () => {
            // Fix: Using backticks to avoid quote issues
            termText.innerHTML = `<span class="text-red-500">ACCESS DENIED. 거부할 수 없습니다.</span>`;
            document.getElementById('term-choices').style.display = 'none';
            setTimeout(() => {
                showScreen('screen-id-gen');
                generateID();
            }, 1500);
        };

        // --- 2. ID Generation ---
        function generateID() {
            const prefixes = ["우울한_", "블랙핑크_", "혼란스러운_", "glitch_", "사이버_", "비밀번호"];
            const suffixes = ["486", "천사", "User99", "boy", "해골", "하트"];
            state.userId = prefixes[Math.floor(Math.random() * prefixes.length)] + suffixes[Math.floor(Math.random() * suffixes.length)];
            
            document.getElementById('generated-id').innerText = state.userId;
            
            // Auto transition after 2 seconds
            setTimeout(() => {
                showScreen('screen-intro-chat');
                startIntroChat();
            }, 2000);
        }

        // --- 3. Intro Chat ---
        function startIntroChat() {
            const box = document.getElementById('intro-chat-box');
            box.innerHTML = '';
            
            setTimeout(() => {
                box.innerHTML += `
                    <div class="flex flex-col">
                        <span class="text-[10px] text-gray-500 mb-1">UNKNOWN</span>
                        <div class="bg-[#2a0015] border border-[var(--neon-pink)] text-white px-3 py-2 max-w-[80%] font-vt text-xl">
                            누구야? 지켜보는 거 다 알아.
                        </div>
                    </div>
                `;
                setTimeout(() => {
                    document.getElementById('intro-chat-choices').classList.remove('hidden');
                }, 1000);
            }, 1000);
        }

        document.getElementById('btn-intro-reply').onclick = (e) => {
            document.getElementById('intro-chat-choices').classList.add('hidden');
            const box = document.getElementById('intro-chat-box');
            
            // User reply
            box.innerHTML += `
                <div class="flex flex-col items-end mt-4">
                    <span class="text-[10px] text-gray-500 mb-1">ME (${state.userId})</span>
                    <div class="bg-[#002200] border border-[var(--neon-green)] text-[var(--neon-green)] px-3 py-2 max-w-[80%] font-vt text-xl">
                        지나가던 사람.
                    </div>
                </div>
            `;

            // Bot final reply
            setTimeout(() => {
                box.innerHTML += `
                    <div class="flex flex-col mt-4">
                        <span class="text-[10px] text-gray-500 mb-1">UNKNOWN</span>
                        <div class="bg-[#2a0015] border border-[var(--neon-pink)] text-white px-3 py-2 max-w-[80%] font-vt text-xl">
                            ...들어오든가.
                        </div>
                    </div>
                `;
                
                // Auto transition to main
                setTimeout(() => {
                    initMainDashboard();
                }, 1500);
            }, 1000);
        };

        // --- 4. Main Dashboard ---
        function initMainDashboard() {
            showScreen('screen-main');
            document.getElementById('card-id').innerText = state.userId;
            document.getElementById('mobile-user-id').innerText = state.userId;
            
            renderMembers();
            loadFeed(memberList[0]);
            startActivityLog();
            initSpycam();
        }

        function renderMembers() {
            const list = document.getElementById('member-list');
            list.innerHTML = memberList.map(id => `
                <div class="member-btn p-3 cursor-pointer border-b lg:border-b-0 lg:border-l-2 border-transparent hover:bg-[#111] transition-all font-pixel text-[8px] lg:text-[10px] text-gray-400 flex-shrink-0" data-id="${id}">
                    > ${id}
                </div>
            `).join('');

            document.querySelectorAll('.member-btn').forEach(btn => {
                btn.onclick = (e) => {
                    document.querySelectorAll('.member-btn').forEach(b => {
                        b.classList.remove('text-[var(--neon-green)]', 'border-[var(--neon-green)]');
                        b.classList.add('text-gray-400', 'border-transparent');
                    });
                    const target = e.currentTarget;
                    target.classList.remove('text-gray-400', 'border-transparent');
                    target.classList.add('text-[var(--neon-green)]', 'border-[var(--neon-green)]');
                    
                    loadFeed(target.getAttribute('data-id'));
                };
            });
            // Select first
            document.querySelector('.member-btn').click();
        }

        function loadFeed(memberId) {
            state.currentMember = memberId;
            document.getElementById('feed-target-id').innerText = memberId;
            
            const grid = document.getElementById('feed-grid');
            const captions = ["오늘 자꾸 열이 난다. 고장 난 것 같아.", "이게 무슨 감정인지 모르겠어.", "자꾸 네가 보여."];
            
            grid.innerHTML = Array(6).fill(0).map((_, i) => {
                const color = ['111', '2a0015', '002200'][i % 3];
                const cap = captions[i % captions.length];
                return `
                    <div class="glitch-img-container aspect-square w-full">
                        <img src="https://placehold.co/400x400/${color}/FF007F?text=HIDDEN" class="glitch-img">
                        <div class="glitch-overlay">CLICK</div>
                        <div class="caption">${cap}</div>
                    </div>
                `;
            }).join('');

            // Click to reveal
            document.querySelectorAll('.glitch-img-container').forEach(el => {
                el.onclick = function() {
                    if(!this.classList.contains('revealed')) {
                        this.classList.add('revealed');
                        addSticker('💔');
                        logActivity(`[${state.userId}]님이 암호화된 사진을 해독했습니다.`);
                    }
                };
            });
        }

        // Stickers
        function addSticker(emoji) {
            if(!state.stickers.has(emoji)) {
                state.stickers.add(emoji);
                const container = document.getElementById('card-stickers');
                if(state.stickers.size === 1) container.innerHTML = '';
                container.innerHTML += `<span class="hover:scale-125 transition-transform cursor-pointer drop-shadow-[0_0_5px_rgba(255,0,127,0.8)]">${emoji}</span>`;
            }
        }

        // React Button
        document.getElementById('btn-react').onclick = () => {
            logActivity(`[${state.userId}]님이 🩹 반응을 보냈습니다.`);
            addSticker('🩹');
            const status = document.getElementById('feed-target-status');
            status.style.color = 'var(--neon-pink)';
            setTimeout(() => status.style.color = '', 500);
        };

        // Activity Log
        function logActivity(text) {
            const log = document.getElementById('activity-log');
            const div = document.createElement('div');
            div.className = 'text-xs font-vt text-gray-400 mb-1';
            div.innerText = text;
            log.appendChild(div);
            log.scrollTop = log.scrollHeight;
        }

        function startActivityLog() {
            setInterval(() => {
                const acts = ["님이 흔적을 남겼습니다.", "님이 접속했습니다.", "님이 상태를 확인 중입니다."];
                const randomUser = "User_" + Math.floor(Math.random() * 999);
                logActivity(`[${randomUser}]${acts[Math.floor(Math.random() * acts.length)]}`);
            }, 4000);
        }

        // Guestbook
        document.getElementById('gb-submit').onclick = () => {
            const input = document.getElementById('gb-input');
            const text = input.value.trim();
            if(!text) return;
            
            appendGb(state.userId, text, false);
            input.value = '';
            logActivity(`[${state.userId}]님이 방명록을 작성했습니다.`);

            if(text.includes('안녕') || text.includes('누구')) {
                setTimeout(() => {
                    appendGb(state.currentMember, "너 혹시... 그때 걔야?", true);
                    addSticker('👁️');
                }, 1500);
            }
        };

        function appendGb(name, text, isMember) {
            const list = document.getElementById('guestbook-list');
            const div = document.createElement('div');
            div.className = `p-2 border-l-2 ${isMember ? 'border-[var(--neon-pink)] bg-[#1a000d]' : 'border-[var(--neon-green)] bg-[#001100]'}`;
            div.innerHTML = `
                <div class="font-pixel text-[8px] ${isMember ? 'text-[var(--neon-pink)]' : 'text-[var(--neon-green)]'} mb-1">${name}</div>
                <div class="font-vt text-lg text-gray-200">${text}</div>
            `;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        // --- 5. DM Modal ---
        const dmModal = document.getElementById('dm-modal');
        const dmMessages = document.getElementById('dm-messages');
        const dmChoices = document.getElementById('dm-choices');

        document.getElementById('btn-open-dm').onclick = () => {
            document.getElementById('dm-target-name').innerText = state.currentMember;
            dmModal.classList.remove('hidden');
            dmModal.classList.add('flex');
            
            dmMessages.innerHTML = '';
            dmChoices.innerHTML = `
                <button onclick="sendDM('자꾸 쳐다보게 돼.')" class="w-full text-left font-vt text-xl text-gray-300 hover:text-[var(--neon-pink)] py-2">> "자꾸 쳐다보게 돼."</button>
            `;
        };

        document.getElementById('btn-close-dm').onclick = () => {
            dmModal.classList.add('hidden');
            dmModal.classList.remove('flex');
        };

        window.sendDM = function(text) {
            dmMessages.innerHTML += `
                <div class="text-right mb-2">
                    <span class="text-[8px] font-pixel text-gray-500 mb-1 inline-block">ME</span><br>
                    <div class="inline-block bg-[#002200] border border-[var(--neon-green)] text-[var(--neon-green)] px-3 py-2 font-vt text-xl">${text}</div>
                </div>
            `;
            dmChoices.innerHTML = '';
            
            setTimeout(() => {
                dmMessages.innerHTML += `
                    <div class="text-left mb-2">
                        <span class="text-[8px] font-pixel text-[var(--neon-pink)] mb-1 inline-block">${state.currentMember}</span><br>
                        <div class="inline-block bg-[#2a0015] border border-[var(--neon-pink)] text-white px-3 py-2 font-vt text-xl">나도 그래. 시스템이 고장 났나 봐.</div>
                    </div>
                `;
                addSticker('📱');
            }, 1000);
        };

        // --- 6. Spycam (WebRTC) ---
        // try-catch 블록을 사용하여 카메라 권한 거부 시에도 앱이 멈추지 않도록 처리합니다.
        async function initSpycam() {
            const video = document.getElementById('spycam-video');
            const container = document.getElementById('spycam-container');
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
            } catch (err) {
                console.log("Spycam access denied or unavailable: ", err);
                // 권한 거부 시 에러 없이 대체 UI 표시
                container.innerHTML = `<div class="w-full h-full flex items-center justify-center bg-[#111] text-red-500 font-pixel text-[8px] text-center p-2 border border-red-500">CAM<br>OFFLINE</div>`;
            }
        }

        // Start Intro on Load
        window.onload = typeWriter;

    </script>
</body>
</html>
